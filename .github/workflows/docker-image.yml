name: Build, scan, and publish image

on:
  push:
    branches:
      - main
    paths:
      - bundle
      - bundle/**
      - .github/workflows/docker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Check CLI help
        run: node cli/cli.js help

      - name: Build container image
        run: docker build --tag "snip-local:${GITHUB_SHA}" bundle

      - name: Smoke-test API, static app, and CLI
        env:
          IMAGE_TAG: snip-local:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --detach --name snip-smoke --publish 3000:3000 "$IMAGE_TAG"
          cleanup() {
            docker rm --force snip-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/links >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs snip-smoke
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:3000/ >/dev/null
          created="$(curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"url":"https://example.com/api-smoke"}' \
            http://127.0.0.1:3000/api/links)"
          code="$(printf '%s' "$created" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              const link = JSON.parse(input);
              if (!link.code || link.hits !== 0) process.exit(1);
              process.stdout.write(link.code);
            });
          ')"
          [ "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3000/$code")" = 302 ]

          SNIP_API=http://127.0.0.1:3000 node cli/cli.js add https://example.com/cli-smoke
          SNIP_API=http://127.0.0.1:3000 node cli/cli.js ls
          links="$(curl --fail --silent http://127.0.0.1:3000/api/links)"
          printf '%s' "$links" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              const links = JSON.parse(input);
              if (links.length !== 2 || links[0].hits !== 1) process.exit(1);
            });
          '

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: snip-local:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish latest and short-SHA tags
        if: github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::7}"
          docker tag "snip-local:${GITHUB_SHA}" "$image:latest"
          docker tag "snip-local:${GITHUB_SHA}" "$image:$short_sha"
          docker push "$image:latest"
          docker push "$image:$short_sha"
